limit_req_zone $binary_remote_addr zone=nail_login:1m rate=6r/m;

server {
    listen 19127;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    access_log /www/wwwlogs/nail-note.access.log;
    error_log /www/wwwlogs/nail-note.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/nail/auth/login {
        limit_req zone=nail_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:19125;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:19125;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
